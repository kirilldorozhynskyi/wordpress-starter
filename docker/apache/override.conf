ServerName localhost
ServerTokens Prod
ServerSignature Off

# Repository .htaccess is deliberately not required for production routing.
<Directory /var/www/html>
	AllowOverride None
	Options -Indexes
	Require all granted
	RewriteEngine On
	RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
	RewriteRule ^healthz$ - [END]
	RewriteRule ^index\.php$ - [END]
	RewriteCond %{REQUEST_FILENAME} !-f
	RewriteCond %{REQUEST_FILENAME} !-d
	RewriteRule . /index.php [END]
</Directory>

Alias /healthz /var/www/html/docker/healthz.txt
<FilesMatch "^\.">
	Require all denied
</FilesMatch>
<LocationMatch "^/(?:vendor|config|scripts|reports|node_modules)(?:/|$)|^/docker/(?!healthz\.txt$)|^/(?:composer\.(?:json|lock)|package(?:-lock)?\.json|.*\.ya?ml)$|^/wp-content/themes/[^/]+/(?:resources/Private|\.inertia)(?:/|$)">
	Require all denied
</LocationMatch>
<Directory /var/www/html/wp-content/uploads>
	<FilesMatch "\.(?:php[0-9]?|phtml|phar)$">
		Require all denied
	</FilesMatch>
</Directory>
<IfModule mod_expires.c>
	ExpiresActive On
	<LocationMatch "^/wp-content/themes/inertia/resources/Public/Build/">
		ExpiresDefault "access plus 1 year"
	</LocationMatch>
</IfModule>
<IfModule mod_headers.c>
	Header always set X-Content-Type-Options "nosniff"
	<LocationMatch "^/wp-content/themes/inertia/resources/Public/Build/">
		Header set Cache-Control "public, max-age=31536000, immutable"
	</LocationMatch>
</IfModule>
