<Directory /var/www/html>
	AllowOverride All
	Require all granted
</Directory>

<IfModule mod_expires.c>
	ExpiresActive On

	<LocationMatch "^/wp-content/themes/inertia/resources/Public/Build/">
		ExpiresDefault "access plus 1 year"
	</LocationMatch>
</IfModule>

<IfModule mod_headers.c>
	<LocationMatch "^/wp-content/themes/inertia/resources/Public/Build/">
		Header set Cache-Control "public, max-age=31536000, immutable"
	</LocationMatch>

	<LocationMatch "^/wp-content/plugins/complianz-gdpr/cookies/language-cookie\.js$">
		Header set Cache-Control "public, max-age=86400"
	</LocationMatch>
</IfModule>
