# Keep in sync with server/nginx/private-paths.conf.
ErrorDocument 404 /index.php?starter_not_found=1

RedirectMatch 404 "(?i)(?:^/(?:config|docker|docs|node_modules|reports|resources|scripts|server|sql|tests|vendor|coverage|wp-content/(?:cache|upgrade|updraft|backups?|ai1wm-backups|wpvividbackups))(?:/|$)|/\.(?!well-known(?:/|$))[^/]+)"
# Allow only the static assets that jD Support requests in the browser.
RedirectMatch 404 "(?i)^/wp-content/mu-plugins(?:$|/(?!(?-i:jd-support/(?:images/jd_white\.svg|assets/admin/environment-notice\.(?:css|js)))$))"
RedirectMatch 404 "(?i)(?:^/(?:wp-config[^/]*|hot|readme\.html|license\.txt|codegraph\.json|[^/]+\.code-workspace|(?:AGENTS|README)\.md|Dockerfile(?:\.[^/]*)?|(?:compose|docker-compose)[^/]*\.ya?ml|(?:config|vite\.config|eslint\.config|ecosystem\.config|tsconfig)\.[^/]+)(?:/|$)|/(?:auth\.json|composer\.(?:json|lock)|package(?:-lock)?\.json|(?:ssr-)?manifest\.json)(?:/|$)|\.(?:map|log|sql(?:\.gz)?|bak|old|orig|swp)(?:/|$)|~$)"
RedirectMatch 404 "(?i)(?:^/wp-content/themes/[^/]+/(?:acf-json|classes|controllers|rest-api)(?:/|$)|^/wp-content/themes/[^/]+/resources(?:$|/(?!Public(?:/|$)))|^/wp-content/plugins/[^/]+/(?:vendor|node_modules|tests|resources/plugins)(?:/|$)|^/wp-content/(?:uploads|themes|plugins)/.*\.(?:php[0-9]*|phtml?|phar|phps)(?:[./]|$))"
