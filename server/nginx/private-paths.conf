# Include at server scope. Keep in sync with server/apache/private-paths.conf.
autoindex off;
error_page 404 =404 /index.php?starter_not_found=1;

if ($uri ~* "(?:^/(?:config|docker|docs|node_modules|reports|resources|scripts|server|sql|tests|vendor|coverage|wp-content/(?:cache|upgrade|updraft|backups?|ai1wm-backups|wpvividbackups))(?:/|$)|/\.(?!well-known(?:/|$))[^/]+)") {
	return 404;
}
# Allow only the static assets that jD Support requests in the browser.
if ($uri ~ "(?i)^/wp-content/mu-plugins(?:$|/(?!(?-i:jd-support/(?:images/jd_white\.svg|assets/admin/environment-notice\.(?:css|js)))$))") {
	return 404;
}
if ($uri ~* "(?:^/(?:wp-config[^/]*|hot|readme\.html|license\.txt|codegraph\.json|[^/]+\.code-workspace|(?:AGENTS|README)\.md|Dockerfile(?:\.[^/]*)?|(?:compose|docker-compose)[^/]*\.ya?ml|(?:config|vite\.config|eslint\.config|ecosystem\.config|tsconfig)\.[^/]+)(?:/|$)|/(?:auth\.json|composer\.(?:json|lock)|package(?:-lock)?\.json|(?:ssr-)?manifest\.json)(?:/|$)|\.(?:map|log|sql(?:\.gz)?|bak|old|orig|swp)(?:/|$)|~$)") {
	return 404;
}
if ($uri ~* "(?:^/wp-content/themes/[^/]+/(?:acf-json|classes|controllers|rest-api)(?:/|$)|^/wp-content/themes/[^/]+/resources(?:$|/(?!Public(?:/|$)))|^/wp-content/plugins/[^/]+/(?:vendor|node_modules|tests|resources/plugins)(?:/|$)|^/wp-content/(?:uploads|themes|plugins)/.*\.(?:php[0-9]*|phtml?|phar|phps)(?:[./]|$))") {
	return 404;
}
